name: CI

# There was no pipeline. The tutor endpoint was open, the "vector database" was
# seeded and never queried, and the models were hardcoded.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        env:
          ENVIRONMENT: testing
          API_KEY: ci-test-key-not-real
          OPENAI_API_KEY: sk-ci-not-real
          CORS_ALLOW_ORIGINS: http://localhost:8000
        run: pytest -q

      - name: The tutor endpoint must reject an unauthenticated call
        # It runs paid model calls; an open endpoint spends the operator's
        # credit. This boots the server and requires a 401.
        env:
          API_KEY: ci-test-key-not-real
          OPENAI_API_KEY: sk-ci-not-real
          CORS_ALLOW_ORIGINS: http://localhost:8000
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break; sleep 1; done
          set -x
          curl -fsS http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<title>'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/v1/tutor/solve \
                 -H 'Content-Type: application/json' \
                 -d '{"task":"hi","student":{"student_id":"s1","name":"A","grade_level":"7","age":12}}')
          [ "$code" = "401" ]

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Bandit
        run: bandit -r . -x ./tests,./.venv,./.venv312 -ll -f screen

      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true  # advisory feed availability, not a code defect

      - name: No credential or database file may be tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|\.db$' || true)
          if [ -n "$tracked" ]; then echo "$tracked"; echo "::error::a credential or data file is committed"; exit 1; fi
          echo "clean"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t lumina:ci .

      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id lumina:ci -u)
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: Serve and answer /health, /ready and the dashboard
        run: |
          docker run -d --name lm -p 8000:8000 -e API_KEY=ci-test-key-not-real -e OPENAI_API_KEY=sk-ci-not-real -e CORS_ALLOW_ORIGINS=http://localhost:8000 lumina:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -sS http://127.0.0.1:8000/ready
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$code" = "200" ] || { echo "::error::dashboard not served (got $code)"; exit 1; }
          docker logs lm | tail -10
          docker rm -f lm
